name: Panel and L3 validation
on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-v2-${{ runner.os }}-validation-${{ hashFiles('go.mod', 'go.sum', 'panel/backend/go.mod', 'panel/backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-v2-${{ runner.os }}-validation-${{ hashFiles('go.mod', 'go.sum', 'panel/backend/go.mod', 'panel/backend/go.sum') }}-
            go-v2-${{ runner.os }}-validation-
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: panel/frontend/package-lock.json
      - run: go test -race ./internal/l3 ./internal/tester ./internal/benchmark
      - run: go test -race ./internal/...
        working-directory: panel/backend
      - name: TLS installer CLI and recovery regressions
        run: sudo bash scripts/test_tls_install.sh
      - run: bash scripts/build.sh
      - run: npx playwright install --with-deps chromium
        working-directory: panel/frontend
      - run: npm run test:ui
        working-directory: panel/frontend
      - name: Compile the privileged L3 race-test runner once
        run: go test -race -c -o dist/l3.test ./internal/l3
      - name: Compile benchmark network and API regressions once
        run: |
          go test -race -c -o dist/benchmark.test ./internal/benchmark
          (cd panel/backend && go test -race -c -o ../../dist/benchmark-api.test ./internal/api)
      - uses: actions/upload-artifact@v4
        with:
          name: validated-benchmark-tests
          path: |
            dist/benchmark.test
            dist/benchmark-api.test
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: validated-l3-test
          path: dist/l3.test
          retention-days: 3
      - name: Share the tested frontend with release jobs
        uses: actions/upload-artifact@v4
        with:
          name: validated-web
          path: panel/frontend/out/
          if-no-files-found: error
          retention-days: 3
          compression-level: 1
      - uses: actions/upload-artifact@v4
        with:
          name: validated-linux-amd64
          path: dist/spoof-tunnel-linux-amd64.tar.gz

  network:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [carriers, smart, diagnostics, multipeer, raw, benchmark]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: validated-linux-amd64
          path: packages
      - name: Unpack the exact binaries that passed validation
        run: |
          mkdir -p dist
          tar -xzf packages/spoof-tunnel-linux-amd64.tar.gz -C dist --strip-components=1
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/download-artifact@v4
        if: matrix.suite == 'raw'
        with:
          name: validated-l3-test
          path: dist
      - uses: actions/download-artifact@v4
        if: matrix.suite == 'benchmark'
        with:
          name: validated-benchmark-tests
          path: dist
      - name: Authenticated carrier benchmark, loss injection and apply rollback
        if: matrix.suite == 'benchmark'
        run: |
          chmod +x dist/benchmark.test dist/benchmark-api.test
          sudo ./dist/benchmark.test -test.v
          sudo ./dist/benchmark-api.test -test.run '^TestBenchmark' -test.v
          sudo python3 scripts/integration_benchmark.py
      - name: Privileged L3 race regressions on all carrier pairs
        if: matrix.suite == 'raw'
        run: chmod +x dist/l3.test && sudo ./dist/l3.test -test.v
      - uses: actions/setup-go@v5
        if: matrix.suite == 'diagnostics'
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v4
        if: matrix.suite == 'diagnostics'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-v2-${{ runner.os }}-validation-${{ hashFiles('go.mod', 'go.sum', 'panel/backend/go.mod', 'panel/backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-v2-${{ runner.os }}-validation-${{ hashFiles('go.mod', 'go.sum', 'panel/backend/go.mod', 'panel/backend/go.sum') }}-
            go-v2-${{ runner.os }}-validation-
      - name: Full carrier matrix, fragmentation and delay
        if: matrix.suite == 'carriers'
        run: |
          sudo env SPOOF_L3_BINARY="$PWD/dist/spoof-l3" python3 scripts/integration_l3.py
          sudo env SPOOF_MTU_TEST=1 SPOOF_L3_BINARY="$PWD/dist/spoof-l3" python3 scripts/integration_l3.py
          sudo env SPOOF_L3_BINARY="$PWD/dist/spoof-l3" python3 scripts/integration_delay.py
      - name: Three smart modes, peer sync, restart and delayed path
        if: matrix.suite == 'smart'
        run: |
          sudo env SPOOF_SMART_POOL=1 SPOOF_L3_BINARY="$PWD/dist/spoof-l3" python3 scripts/integration_l3.py
          for mode in round_robin failover; do
            sudo env SPOOF_SMART_POOL=1 SPOOF_SMART_SMOKE=1 SPOOF_POOL_MODE="$mode" SPOOF_L3_BINARY="$PWD/dist/spoof-l3" python3 scripts/integration_l3.py
          done
          sudo env SPOOF_SMART_POOL=1 SPOOF_L3_BINARY="$PWD/dist/spoof-l3" python3 scripts/integration_delay.py
      - name: Three foreign peers, TXT selection and shared carrier ports
        if: matrix.suite == 'multipeer'
        run: sudo python3 scripts/integration_multipeer.py
      - name: Tester, forwarding, credentials and updater sandbox
        if: matrix.suite == 'diagnostics'
        run: |
          sudo env SPOOF_PANEL_BINARY="$PWD/dist/spoof-panel" python3 scripts/integration_tester_api.py
          sudo env "PATH=$PATH" "GOMODCACHE=$(go env GOMODCACHE)" python3 scripts/integration_tester.py
          sudo env "PATH=$PATH" "GOMODCACHE=$(go env GOMODCACHE)" python3 scripts/integration_forward.py
          SPOOF_PANEL_BINARY=dist/spoof-panel python3 scripts/smoke_panel.py
          python3 scripts/test_installer_credentials.py
          sudo python3 scripts/integration_updater_systemd.py
