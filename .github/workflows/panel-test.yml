name: Panel and L3 validation
on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-v2-${{ runner.os }}-validation-${{ hashFiles('go.mod', 'go.sum', 'panel/backend/go.mod', 'panel/backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-v2-${{ runner.os }}-validation-${{ hashFiles('go.mod', 'go.sum', 'panel/backend/go.mod', 'panel/backend/go.sum') }}-
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: panel/frontend/package-lock.json
      - run: go test -race ./internal/l3 ./internal/tester
      - run: go test -race ./internal/...
        working-directory: panel/backend
      - run: bash scripts/build.sh
      - run: npx playwright install --with-deps chromium
        working-directory: panel/frontend
      - run: npm run test:ui
        working-directory: panel/frontend
      - run: sudo env SPOOF_PANEL_BINARY="$PWD/dist/spoof-panel" python3 scripts/integration_tester_api.py
      - run: sudo env "PATH=$PATH" "GOMODCACHE=$(go env GOMODCACHE)" python3 scripts/integration_tester.py
      - run: sudo env "PATH=$PATH" "GOMODCACHE=$(go env GOMODCACHE)" python3 scripts/integration_forward.py
      - run: sudo env SPOOF_L3_BINARY="$PWD/dist/spoof-l3" python3 scripts/integration_l3.py
      - name: Smart pools, authenticated sync and one-sided restart
        run: sudo env SPOOF_SMART_POOL=1 SPOOF_L3_BINARY="$PWD/dist/spoof-l3" python3 scripts/integration_l3.py
      - name: Raw source quarantine and pool replay regressions
        run: sudo env "PATH=$PATH" "GOMODCACHE=$(go env GOMODCACHE)" go test -race ./internal/l3
      - run: sudo env SPOOF_MTU_TEST=1 SPOOF_L3_BINARY="$PWD/dist/spoof-l3" python3 scripts/integration_l3.py
      - run: sudo env SPOOF_L3_BINARY="$PWD/dist/spoof-l3" python3 scripts/integration_delay.py
      - name: Adaptive pool on a delayed path (RTT greater than 3 seconds)
        run: sudo env SPOOF_SMART_POOL=1 SPOOF_L3_BINARY="$PWD/dist/spoof-l3" python3 scripts/integration_delay.py
      - run: sudo python3 scripts/integration_multipeer.py
      - run: python3 scripts/smoke_panel.py
        env:
          SPOOF_PANEL_BINARY: dist/spoof-panel
      - run: python3 scripts/test_installer_credentials.py
      - name: Share the tested frontend with release jobs
        uses: actions/upload-artifact@v4
        with:
          name: validated-web
          path: panel/frontend/out/
          if-no-files-found: error
          retention-days: 3
          compression-level: 1
      - uses: actions/upload-artifact@v4
        with:
          name: validated-linux-amd64
          path: dist/spoof-tunnel-linux-amd64.tar.gz
